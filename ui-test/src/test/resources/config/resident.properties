# ─── Resident Portal UI Automation Configuration ─────────────────────────────
# Tracked with blank/default values only — fill in env-specific URLs and the three
# *_client_secret keys below for your own local run, but never commit real values back here.
#
# Priority (lowest → highest):
#   Kernel.properties  (apitest-commons JAR)
#   uitest.properties  (uitest-commons JAR)
#   this file
#   environment variables / Rancher overrides
#
# Only declare keys here that are:
#   (a) not present in Kernel / uitest at all, OR
#   (b) present but EMPTY in Kernel / uitest (we supply the value), OR
#   (c) intentionally overriding a non-empty default

# ─── Module identity ──────────────────────────────────────────────────────────
moduleName=residentUI

# ─── Environment URLs ─────────────────────────────────────────────────────────
# Not in Kernel/uitest — must be set per environment
baseUrl=
apiInternalEndPoint=

# Override Kernel defaults (Kernel has a different env hardcoded)
keycloak-external-url=

# ─── Resident-specific API path fragments ─────────────────────────────────────
# (currentUserURI, actuatorEndpoint, tokenEndpoint already in Kernel.properties)
masterSchemaURL=/v1/masterdata/idschema/latest
appVersionEndpoint=/resident/v1/actuator/info
addIdentityURL=/idrepository/v1/identity/
idRepoGenVidURL=/idrepository/v1/vid
locationHierarchyLevels=/v1/masterdata/locationHierarchyLevels/
locationhierarchy=/v1/masterdata/locations/locationhierarchy/
id=mosip.id.create

# ─── Keycloak / IAM ───────────────────────────────────────────────────────────
# keycloak_UserName, keycloak-realm-id already in Kernel with correct values

# Override Kernel (Kernel has a hardcoded list of user IDs; we use auto-create)
iam-users-to-create=auto

# Override: Kernel uses 220005; we use the module-prefixed auto user (resident-ui-auto)
admin_userName=auto
roles.auto=GLOBAL_ADMIN,ID_AUTHENTICATION,REGISTRATION_ADMIN,REGISTRATION_SUPERVISOR,ZONAL_ADMIN

# Not in Kernel as a standalone key
roles=GLOBAL_ADMIN,ID_AUTHENTICATION,REGISTRATION_ADMIN,REGISTRATION_SUPERVISOR,ZONAL_ADMIN

# ─── Client secrets ───────────────────────────────────────────────────────────
# app_ids and client_ids already in Kernel with correct values
# Kernel has all secrets empty — fill these in locally; NEVER commit real values here.
mosip_idrepo_client_secret=
mosip_admin_client_secret=
mosip_testrig_client_secret=

# ─── Browser & execution ──────────────────────────────────────────────────────
# browser, loginlang, OTPTimeOut default in uitest.properties
# langselect, attempt
headless=yes

# ─── Report & S3 ──────────────────────────────────────────────────────────────
# push-reports-to-s3, s3-host, s3-account, s3-region, reportExpirationInDays,
# reportLogPath, s3-user-key already in Kernel/uitest with correct values

# Override uitest default (uitest has "MOSIP UI Automation")
reportName=Resident Portal UI Automation

# Override uitest default (target/extent-reports/) — keep report output out of the
# Maven-managed, mvn-clean-wiped target/ tree, at the module root instead.
reportOutputDir=test-output/

# Kernel has s3-user-secret empty — this is the well-known default MinIO admin credential,
# fine for local/dev MinIO; override for anything else.
s3-user-secret=minioadmin

# ─── Test data ────────────────────────────────────────────────────────────────

# Run only specific scenarios, by exact name (case-insensitive, comma-separated) — leave
# blank to run everything. e.g. scenarioToRun=Login with VID,Login with UIN
scenarioToRun=

# no (default) = auto-generate a fresh UIN + VIDs via API at suite startup — portable across
#   environments, nothing to fill in below.
# yes = use the uin/perpetualvid/temporaryvid/onetimevid values below instead (only read when
#   this is "yes" — leave them blank otherwise, since a hardcoded identity can expire/get
#   consumed between runs).
identityGenManual=no
uin=
perpetualvid=
temporaryvid=
onetimevid=
externalemail=Te.Sc.1271@mailinator.com
postalcode=14080
packetUpdateWait=5

# Delay (ms) between each parallel worker thread's first scenario, so they don't all hit the
# login/auth endpoints in the same instant under parallel execution.
scenarioStaggerMillis=3000

# Delay (ms) after generating a fresh UIN/VID before the first login attempt, letting MOSIP's
# async pipeline (dedup, ID-repo sync, auth propagation) finish before we try to authenticate.
identitySettleMillis=60000